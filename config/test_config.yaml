# Test execution configuration
# These settings control how tests are executed (browser behavior, timeouts, retries)

browser:
  type: "chromium"  # chromium, firefox, webkit
  headless: false
  viewport:
    width: 1920
    height: 1080
  slowmo: 0  # milliseconds to slow down operations (useful for debugging)
  args:
    - "--disable-blink-features=AutomationControlled"
    - "--disable-dev-shm-usage"

timeouts:
  default: 30000  # 30 seconds - default timeout for all operations
  navigation: 60000  # 60 seconds - page navigation timeout
  action: 10000  # 10 seconds - element action timeout (click, fill, etc.)
  api_request: 30000  # 30 seconds - API request timeout

retry:
  max_attempts: 3
  backoff_factor: 2  # exponential backoff: 1s, 2s, 4s
  retry_on_status_codes:
    - 500
    - 502
    - 503
    - 504

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s [%(levelname)8s] [%(name)s] %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  log_file: "reports/test_execution.log"

screenshots:
  on_failure: true
  path: "reports/screenshots"

video:
  enabled: false  # Set to true to record videos
  path: "reports/videos"

authentication:
  storage_state_path: "auth_state/storage_state.json"
  token_validity_seconds: 3600  # 1 hour
  reauth_on_401: true
