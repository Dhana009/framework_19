[pytest]
# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Execution options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    --alluredir=reports/allure-results
    --html=reports/html-report/report.html
    --self-contained-html

# Registered markers
markers =
    smoke: Smoke tests - critical path validation
    sanity: Sanity tests - feature-level validation
    regression: Regression tests - comprehensive validation
    ui: UI-based tests using Page Object Model
    api: API-based tests using backend services

# Test paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread
